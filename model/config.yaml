# Konfigurasi pemodelan K-NN (spec 15 Okt 2026, revisi + keputusan Dav 15 Okt 2026). Path relatif terhadap model/.
# Status butir spec §16 dicatat di run_manifest.json (`proposals`): "diputuskan Dav 2026-10-15" atau "usulan".
# Nilai tidak boleh diubah setelah metrik uji terlihat. Hash config ini dibekukan dengan `python run_all.py freeze`.

run:
  run_id: "model_v1"
  # Satu set fitur (pembacaan A, §16 butir 11): kepadatan leksikon / jumlah token. Dicek terhadap
  # `lexicon_denominator` di laporan FE.
  input_variant: "penyebut_token"
  random_state_global: 42            # usulan (§16 butir 9); dibekukan
  label_col: "label"                 # kontrak anotasi: 0 = non_buzzer, 1 = buzzer
  positive_label: 1                  # buzzer = kelas positif untuk precision/recall/F1
  supersedes:                        # spec §12: evaluasi lama + alasan perubahan setelah metrik uji terlihat
    run_id: "model_v1"
    reason: "Evaluasi pertama model_v1 (15 Okt 2026; seleksi K dengan F1 biner kelas buzzer) diganti: seleksi K memakai macro-F1 atas keputusan Dav setelah metrik uji evaluasi pertama terlihat (post-hoc). Keluaran lama diarsipkan di _archive/model_outputs_model_v1_f1_buzzer/."

input:
  root: "../feature_engineering/features_sensitivity_token"
  split_dirs: {70: "split_70_30", 80: "split_80_20", 90: "split_90_10"}
  train_file: "train.csv"
  test_file: "test.csv"
  fe_manifest: "../feature_engineering/features_sensitivity_token/report.json"          # leksikon beku, status penskalaan, seed
  split_manifest: "../feature_engineering/features_sensitivity_token/split_manifest.json" # bila tidak ada -> dibuat m00 (generated_by: model_m00)

expected:                            # data terkunci (spec §1)
  n_total: 626
  n_buzzer: 89

splits: [70, 80, 90]

feature_configs:
  akun:     [pengikut, rasio_balasan, rasio_unggahan_ulang, threads_topik, balasan_topik]
  teks:     [similarity, kepadatan_leksikon_a, kepadatan_leksikon_b]
  gabungan: [pengikut, rasio_balasan, rasio_unggahan_ulang, threads_topik, balasan_topik,
             similarity, kepadatan_leksikon_a, kepadatan_leksikon_b]

scaling:
  performed_in: "feature_engineering"   # §16 butir 1 (diputuskan): split + penskalaan FE dipakai apa adanya

imbalance:
  minority_share_threshold: 0.30     # usulan (§16 butir 2); praktis tidak berpengaruh pada 14,2% (spec §7.1)

smote:                               # §16 butir 3 (diputuskan): default pustaka, hanya data latih terskala
  sampling_strategy: "auto"          # penyeimbangan penuh 1:1
  k_neighbors: 5

tuning:
  k_grid: [3, 5, 7, 9]
  cv_folds: 5
  cv_stratified: true                # §16 butir 5 (diputuskan)
  cv_shuffle: true                   # §16 butir 5 (diputuskan)
  cv_mode: "acc_literal"             # §16 butir 5 (diputuskan): CV pada data latih hasil SMOTE; in_fold tidak dipakai
  selection_metric: "f1_macro"       # §16 butir 4 (diputuskan Dav 15 Okt 2026): macro-F1 (F1 buzzer + non-buzzer)
  tie_break: "larger_k"              # usulan (§16 butir 6); deterministik
  weak_selection_std_ddof: 1         # usulan; SD F1 antar-fold untuk penanda "pemilihan K lemah" (diagnostik §8.1)

knn:                                 # terkunci (spec §1): Euclidean, keputusan mayoritas tetangga
  metric: "euclidean"
  weights: "uniform"
  algorithm: "auto"

evaluation:
  zero_division: 0
  report_baselines: true             # usulan (§16 butir 8): pembanding "selalu non-buzzer" (spec §10.3)

output_dir: "outputs"                # hasil di outputs/{run_id}/
